[project]
name = "fiquesegura"
version = "0.1.0"
description = ""
authors = [{ name = "Priscila Pereira Nunes" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "pandas>=2.2.3,<3",
    "streamlit>=1.43.2,<2",
    "tabulate>=0.9.0,<0.10",
    "folium>=0.19.5,<0.20",
    "geopandas>=1.0.1,<2",
    "streamlit-folium>=0.24.0,<0.25",
    "unidecode>=1.3.8,<2",
    "matplotlib>=3.10.1,<4",
    "watchdog>=6.0.0,<7",
    "requests>=2.32.5,<3",
    "streamlit-js-eval>=0.1.7,<0.2",
    "xlsxwriter>=3.2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "pytest-cov>=6.1.1,<7",
    "ipykernel>=6.29.5,<7",
]

[tool.hatch.build.targets.sdist]
include = [
    "pages",
    "utils",
]

[tool.hatch.build.targets.wheel]
include = [
    "pages",
    "utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
